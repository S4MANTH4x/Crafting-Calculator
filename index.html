<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RedM Crafting Notebook</title>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        :root {
            /* --- COLOR CONFIGURATION --- */
            --paper-bg: #f4ebd8;
            --paper-dark: #e6d8c0;
            --ink: #2c1a0f;
            --ink-light: #5d4037;
            --accent: #8b1a1a;
            --line-color: rgba(139, 90, 43, 0.2);

            /* ========================================= */
            /* --- FONT SIZE CONFIGURATION (DESKTOP) --- */
            /* Change these values to scale specific text */
            /* ========================================= */
            --fs-index-title: 28px;       
            --fs-search-bar: 16px;        
            --fs-recipe-tab: 18px;        
            --fs-recipe-icon: 20px;       
            --fs-button: 16px;            
            --fs-copy-btn: 14px;          
            
            --fs-recipe-h2: 20px;         
            --fs-recipe-h3: 20px;         
            --fs-xp-text: 16px;           
            --fs-price-text: 18px;        
            --fs-list-item: 16px;         
            
            --fs-qty-label: 16px;         
            --fs-qty-input: 16px;         
            
            --fs-form-title: 28px;        
            --fs-form-input: 16px;        
            
            --fs-default-h2: 28px;        
            --fs-default-p: 18px;         
            /* ========================================= */
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Special Elite', monospace;
            background: rgba(0, 0, 0, 0.5);
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        input, textarea, button {
            -webkit-user-select: text;
            user-select: text;
            touch-action: manipulation; 
        }

        /* Responsive Notebook Container */
        .notebook {
            position: relative;
            width: min(900px, 94vw);
            height: min(600px, 85vh);
            display: flex;
            background: var(--paper-bg);
            border-radius: 10px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6), inset 0 0 60px rgba(139, 90, 43, 0.15);
            perspective: 1500px;
            -webkit-perspective: 1500px;
        }

        .spine {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 40px;
            transform: translateX(-50%);
            background: linear-gradient(to right, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0) 20%, rgba(0,0,0,0) 80%, rgba(0,0,0,0.2) 100%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
            pointer-events: none;
        }

        .ring {
            width: 25px;
            height: 12px;
            background: linear-gradient(to bottom, #777, #333, #777);
            border-radius: 10px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
        }

        .page-left, .page-right {
            flex: 1;
            padding: 40px;
            box-sizing: border-box;
            background-image: repeating-linear-gradient(transparent, transparent 29px, var(--line-color) 30px);
            background-position: 0 10px;
            position: relative;
        }

        .page-left { border-right: 1px solid rgba(0,0,0,0.1); }

        .index-title {
            font-size: var(--fs-index-title);
            color: var(--ink); text-align: center; margin-top: 0;
            margin-bottom: 10px; border-bottom: 2px solid var(--ink); padding-bottom: 10px;
        }

        .search-bar {
            width: 100%; background: transparent; border: none;
            border-bottom: 1px dashed var(--ink); font-family: 'Special Elite', monospace;
            font-size: var(--fs-search-bar); color: var(--ink); padding: 8px 5px;
            margin-bottom: 15px; outline: none; box-sizing: border-box;
        }
        
        .search-bar::placeholder { color: rgba(139, 90, 43, 0.6); }
        .search-bar:focus { border-bottom: 2px solid var(--accent); }

        .recipe-list {
            height: calc(100% - 150px);
            overflow-y: auto; padding-right: 10px;
        }

        .recipe-list::-webkit-scrollbar { width: 6px; }
        .recipe-list::-webkit-scrollbar-track { background: transparent; }
        .recipe-list::-webkit-scrollbar-thumb { background: rgba(139, 90, 43, 0.4); border-radius: 3px; }

        .recipe-tab {
            padding: 10px; margin-bottom: 8px; cursor: pointer;
            font-size: var(--fs-recipe-tab); color: var(--ink-light);
            border: 1px dashed transparent; transition: all 0.2s;
            display: flex; align-items: center; -webkit-tap-highlight-color: transparent;
        }

        @media (hover: hover) {
            .recipe-tab:hover {
                color: var(--ink); border-bottom: 1px dashed var(--ink); transform: translateX(5px);
            }
        }

        .recipe-tab.active { color: var(--accent); font-weight: bold; border-bottom: 1px dashed var(--accent); }
        .recipe-icon { width: 24px; height: 24px; object-fit: contain; margin-right: 8px; vertical-align: middle; }
        .recipe-icon-text { font-size: var(--fs-recipe-icon); margin-right: 8px; vertical-align: middle; }

        .add-btn-container { position: absolute; bottom: 30px; left: 0; width: 100%; text-align: center; }
        .btn {
            background: transparent; font-family: 'Special Elite', monospace; border: 1px solid var(--ink);
            color: var(--ink); padding: 8px 16px; cursor: pointer;
            font-size: var(--fs-button); transition: all 0.2s; border-radius: 3px;
        }
        .btn:hover { background: var(--ink); color: var(--paper-bg); }

        .content-container {
            position: relative; width: 100%; height: 100%; transform-style: preserve-3d;
            -webkit-transform-style: preserve-3d; transform-origin: left center;
            -webkit-backface-visibility: hidden; backface-visibility: hidden;
        }

        .flip-animation { animation: turnPage 0.5s ease-in-out forwards; }
        @keyframes turnPage {
            0% { transform: rotateY(0deg); opacity: 0; }
            50% { transform: rotateY(90deg); opacity: 0; }
            51% { transform: rotateY(90deg); opacity: 1; }
            100% { transform: rotateY(0deg); opacity: 1; }
        }

        /* Fixed H2 Title layout for long names */
        h2 { 
            margin-top: 0; 
            color: var(--ink); 
            font-size: var(--fs-recipe-h2); 
            margin-bottom: 5px; 
            line-height: 1.2;
            word-break: break-word;
        }

        .xp-text { color: var(--accent); font-size: var(--fs-xp-text); font-weight: bold; margin-bottom: 15px;}
        .price-text { font-size: var(--fs-price-text); font-weight: bold; margin-bottom: 20px;}
        h3 { font-size: var(--fs-recipe-h3); margin-top: 20px;}
        
        ul { list-style-type: none; padding-left: 0; margin-top: 0;}
        li { font-size: var(--fs-list-item); margin-bottom: 6px; color: var(--ink-light); display: flex; justify-content: space-between;}
        
        .copy-btn {
            background: var(--ink); color: var(--paper-bg); border: none; padding: 5px 10px;
            font-family: 'Special Elite', monospace; cursor: pointer; font-size: var(--fs-copy-btn);
            border-radius: 3px; margin-left: 15px; transition: background 0.2s;
        }
        .copy-btn:hover { background: var(--accent); }

        .target-qty-container { 
            display: flex; 
            align-items: center; 
            font-size: var(--fs-qty-label); 
            color: var(--ink); 
            flex-shrink: 0;
            margin-left: 10px;
        }

        .target-qty-input {
            width: 55px; text-align: center; margin-left: 10px; background: rgba(139, 90, 43, 0.1);
            border: 1px solid var(--ink); border-radius: 3px; padding: 4px;
            font-family: 'Special Elite', monospace; font-size: var(--fs-qty-input);
        }

        .form-view { display: none; }
        .form-view h2 { font-size: var(--fs-form-title); }
        .form-group { margin-bottom: 10px; display: flex; gap: 10px;}
        input {
            background: transparent; border: none; border-bottom: 1px dashed var(--ink);
            font-family: 'Special Elite', monospace; font-size: var(--fs-form-input);
            color: var(--ink); padding: 5px; outline: none;
        }
        input:focus { border-bottom: 2px solid var(--accent); }
        .input-full { width: 100%; }
        .input-small { width: 60px; }
        .dynamic-list { max-height: 110px; overflow-y: auto; margin-bottom: 10px; padding-right: 5px;}
        
        .add-row-btn {
            background: transparent; border: 1px dashed var(--ink-light); color: var(--ink-light);
            cursor: pointer; width: 100%; padding: 5px; font-family: 'Special Elite', monospace;
            margin-bottom: 10px; font-size: var(--fs-button);
        }
        .add-row-btn:hover { border-color: var(--ink); color: var(--ink); }

        #defaultView {
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            height: 100%; text-align: center; color: var(--ink-light); opacity: 0.7;
        }
        #defaultView h2 { border: none; font-size: var(--fs-default-h2); justify-content: center; margin-bottom: 15px;}
        #defaultView p { font-size: var(--fs-default-p); max-width: 80%; line-height: 1.5; }

        @media screen and (max-width: 768px) {
            :root {
                --fs-index-title: 22px; --fs-recipe-tab: 16px; --fs-recipe-h2: 24px;
                --fs-recipe-h3: 18px; --fs-price-text: 14px; --fs-list-item: 14px;
                --fs-default-h2: 24px; --fs-default-p: 16px;
            }
            .page-left, .page-right { padding: 20px 15px; }
            .recipe-tab { padding: 8px 5px; }
        }

    </style>
</head>

    <div class="notebook">
        <!-- Spine -->
        <div class="spine">
            <div class="ring"></div>
            <div class="ring"></div>
            <div class="ring"></div>
            <div class="ring"></div>
            <div class="ring"></div>
        </div>

        <!-- Left Page (Index) -->
        <div class="page-left">
            <h1 class="index-title">Crafting Index</h1>
            <input type="text" id="searchInput" class="search-bar" placeholder="🔍 Search recipes..." onkeyup="filterRecipes()">
            <div class="recipe-list" id="recipeList"></div>
            <div class="add-btn-container">
                <button class="btn" onclick="openAddForm()">+ Draft New Recipe</button>
            </div>
        </div>

        <!-- Right Page (Content) -->
        <div class="page-right">
            <div class="content-container" id="pageContent">
                
                <!-- Default Placeholder View -->
                <div id="defaultView">
                    <h2>📖 Open a page...</h2>
                    <p>Select a recipe from the index on the left to review its details, or draft a brand new recipe.</p>
                </div>

                <!-- Recipe Display View -->
                <div id="recipeView" style="display: none;">
                    <!-- Static layout built via JS, numbers update dynamically -->
                </div>

                <!-- Add Recipe Form View -->
                <div id="addFormView" class="form-view">
                    <h2>New Draft</h2>
                    <div class="form-group"><input type="text" id="f_icon" class="input-full" placeholder="Icon Image URL or Emoji (Optional)"></div>
                    <div class="form-group">
                        <input type="number" id="f_yield" class="input-small" placeholder="Qty">
                        <input type="text" id="f_name" class="input-full" placeholder="Recipe Name (e.g. Gunoil)">
                    </div>
                    <div class="form-group">
                        <input type="number" id="f_xp" class="input-small" placeholder="XP">
                        <input type="number" step="0.01" id="f_price" class="input-small" placeholder="Total $">
                    </div>

                    <h3 style="border-bottom: 1px dashed var(--ink); padding-bottom: 5px; margin-bottom: 10px;">Ingredients</h3>
                    <div class="dynamic-list" id="ingredientsList">
                        <div class="form-group">
                            <input type="number" class="input-small i-qty" placeholder="Qty">
                            <input type="text" class="input-full i-name" placeholder="Item Name">
                            <input type="number" step="0.01" class="input-small i-cost" placeholder="$ Cost">
                        </div>
                    </div>
                    <button class="add-row-btn" onclick="addIngredientRow()">+ Add Ingredient</button>

                    <h3 style="border-bottom: 1px dashed var(--ink); padding-bottom: 5px; margin-bottom: 10px;">Required Tools</h3>
                    <div class="dynamic-list" id="toolsList">
                        <div class="form-group">
                            <input type="text" class="input-full t-name" placeholder="Tool (e.g. Grinder)">
                        </div>
                    </div>
                    <button class="add-row-btn" onclick="addToolRow()">+ Add Tool</button>
                    <div style="margin-top: 5px; text-align: right;"><button class="btn" onclick="saveRecipe()">Save to Notebook</button></div>
                </div>

            </div>
        </div>
    </div>

        let recipes = JSON.parse(localStorage.getItem('redm_crafting_recipes')) || defaultRecipes;
        let currentRecipeIndex = null;
        let currentTargetQty = 1; 

        const recipeListEl = document.getElementById('recipeList');
        const contentContainer = document.getElementById('pageContent');
        const defaultView = document.getElementById('defaultView');
        const recipeView = document.getElementById('recipeView');
        const formView = document.getElementById('addFormView');

        function getIconHTML(iconData) {
            if (!iconData) return '';
            if (iconData.startsWith('http') || iconData.includes('.png') || iconData.includes('.jpg') || iconData.includes('.webp')) {
                return `<img src="${iconData}" class="recipe-icon" alt="icon">`;
            }
            return `<span class="recipe-icon-text">${iconData}</span>`;
        }

        function triggerFlip() {
            contentContainer.classList.remove('flip-animation');
            void contentContainer.offsetWidth; 
            contentContainer.classList.add('flip-animation');
        }

        function renderIndex() {
            recipeListEl.innerHTML = '';
            recipes.forEach((recipe, index) => {
                const div = document.createElement('div');
                div.className = 'recipe-tab';
                div.setAttribute('data-name', recipe.name.toLowerCase()); 
                div.innerHTML = `${getIconHTML(recipe.icon)} <span>${recipe.name}</span>`;
                div.onclick = () => loadRecipe(index, div);
                recipeListEl.appendChild(div);
            });
        }

        function filterRecipes() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            document.querySelectorAll('.recipe-tab').forEach(tab => {
                const name = tab.getAttribute('data-name');
                tab.style.display = name.includes(query) ? 'flex' : 'none';
            });
        }

        function loadRecipe(index, tabElement) {
            triggerFlip();
            document.querySelectorAll('.recipe-tab').forEach(el => el.classList.remove('active'));
            if(tabElement) tabElement.classList.add('active');

            defaultView.style.display = 'none';
            formView.style.display = 'none';
            recipeView.style.display = 'block';

            currentRecipeIndex = index;
            currentTargetQty = recipes[currentRecipeIndex].yield || 1; 
            
            buildRecipeSkeleton(); 
        }

        function buildRecipeSkeleton() {
            const r = recipes[currentRecipeIndex];
            const headerIcon = getIconHTML(r.icon);

            recipeView.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 5px; gap: 10px;">
                    <h2 style="margin:0; flex: 1;">${headerIcon}<span id="rv_yield_display"></span>x ${r.name}</h2>
                    <div class="target-qty-container">
                        <label>Qty:</label>
                        <input type="number" min="1" value="${currentTargetQty}" oninput="updateTargetQuantity(this.value)" class="target-qty-input">
                    </div>
                </div>
                
                <div class="xp-text" id="rv_xp_display"></div>
                <div class="price-text" id="rv_price_display"></div>
                
                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 25px; border-bottom: 1px dashed var(--ink); padding-bottom: 5px; margin-bottom: 10px;">
                    <h3 style="margin:0; border: none; padding: 0;">Required Ingredients</h3>
                    <button class="copy-btn" onclick="copyIngredients()">Copy List</button>
                </div>
                <ul id="rv_ingredients_display"></ul>

                <h3 style="border-bottom: 1px dashed var(--ink); padding-bottom: 5px; margin-bottom: 10px; margin-top: 20px;">Required Tools</h3>
                <ul id="rv_tools_display"></ul>
            `;

            let toolHTML = '';
            r.tools.forEach(t => { toolHTML += `<li>${t}</li>`; });
            document.getElementById('rv_tools_display').innerHTML = toolHTML || "<li>None</li>";

            updateCalculations(currentTargetQty);
        }

        function updateTargetQuantity(val) {
            let target = parseInt(val);
            let mathTarget = target;
            
            if (isNaN(target) || target < 1) {
                mathTarget = 1;
                currentTargetQty = 1;
            } else {
                currentTargetQty = target;
            }
            
            updateCalculations(mathTarget);
        }

        function updateCalculations(activeTarget) {
            const r = recipes[currentRecipeIndex];
            const requiredBatches = Math.ceil(activeTarget / r.yield);
            
            const calcYield = r.yield * requiredBatches;
            const calcXp = r.xp * requiredBatches;
            const calcPrice = r.totalPrice * requiredBatches;

            document.getElementById('rv_yield_display').innerText = calcYield;
            document.getElementById('rv_xp_display').innerText = `+${calcXp} XP`;
            document.getElementById('rv_price_display').innerText = `Total Price: $${calcPrice.toFixed(2)}`;

            let ingHTML = '';
            r.ingredients.forEach(i => {
                const calcQty = i.qty * requiredBatches;
                ingHTML += `<li><span>${calcQty}x ${i.name}</span> <span>$${i.cost.toFixed(2)}/per</span></li>`;
            });
            document.getElementById('rv_ingredients_display').innerHTML = ingHTML;
        }

        function copyIngredients() {
            const r = recipes[currentRecipeIndex];
            const requiredBatches = Math.ceil(currentTargetQty / r.yield);
            const calcYield = r.yield * requiredBatches;
            
            let text = `Ingredients needed for ${calcYield}x ${r.name}:\n`;
            r.ingredients.forEach(i => { text += `- ${i.qty * requiredBatches}x ${i.name}\n`; });

            const btn = document.querySelector('.copy-btn');
            function showSuccess() {
                btn.innerText = "Copied!"; btn.style.background = "var(--accent)";
                setTimeout(() => { btn.innerText = "Copy List"; btn.style.background = "var(--ink)"; }, 1500);
            }

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(showSuccess).catch(fallbackCopy);
            } else {
                fallbackCopy();
            }

            function fallbackCopy() {
                const textArea = document.createElement("textarea");
                textArea.value = text; textArea.style.position = "fixed"; textArea.style.top = "0"; textArea.style.left = "-9999px";
                document.body.appendChild(textArea); textArea.focus(); textArea.select();
                try { document.execCommand('copy'); showSuccess(); } catch (err) { console.error("Copy failed", err); }
                document.body.removeChild(textArea);
            }
        }

        function openAddForm() {
            triggerFlip();
            document.querySelectorAll('.recipe-tab').forEach(el => el.classList.remove('active'));
            defaultView.style.display = 'none'; recipeView.style.display = 'none'; formView.style.display = 'block';
            document.querySelectorAll('input').forEach(input => input.value = '');
            document.getElementById('searchInput').value = ''; filterRecipes();
        }

        function addIngredientRow() {
            const row = document.createElement('div'); row.className = 'form-group';
            row.innerHTML = `<input type="number" class="input-small i-qty" placeholder="Qty"><input type="text" class="input-full i-name" placeholder="Item Name"><input type="number" step="0.01" class="input-small i-cost" placeholder="$ Cost">`;
            document.getElementById('ingredientsList').appendChild(row);
        }

        function addToolRow() {
            const row = document.createElement('div'); row.className = 'form-group';
            row.innerHTML = `<input type="text" class="input-full t-name" placeholder="Tool (e.g. Grinder)">`;
            document.getElementById('toolsList').appendChild(row);
        }

        function saveRecipe() {
            const name = document.getElementById('f_name').value.trim();
            if (!name) return alert("Recipe needs a name!");

            const newRecipe = {
                name: name, icon: document.getElementById('f_icon').value.trim(),
                yield: parseInt(document.getElementById('f_yield').value) || 1, xp: parseInt(document.getElementById('f_xp').value) || 0,
                totalPrice: parseFloat(document.getElementById('f_price').value) || 0.00, ingredients: [], tools: []
            };

            document.querySelectorAll('#ingredientsList .form-group').forEach(group => {
                const qty = parseInt(group.querySelector('.i-qty').value);
                const iName = group.querySelector('.i-name').value.trim();
                const cost = parseFloat(group.querySelector('.i-cost').value);
                if (iName && qty) newRecipe.ingredients.push({ qty: qty, name: iName, cost: cost || 0.00 });
            });

            document.querySelectorAll('#toolsList .form-group').forEach(group => {
                const tName = group.querySelector('.t-name').value.trim();
                if (tName) newRecipe.tools.push(tName);
            });

            recipes.push(newRecipe);
            localStorage.setItem('redm_crafting_recipes', JSON.stringify(recipes));
            renderIndex(); loadRecipe(recipes.length - 1, document.querySelectorAll('.recipe-tab')[recipes.length - 1]);
        }

        window.onload = () => { renderIndex(); };
    </script>
</body>
</html>
